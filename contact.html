<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Contact — TechScope</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <h1>Contact</h1>
    <p>Questions, partnership inquiries, or privacy requests — email us or use the form below.</p>

    <p>Email: <a href="mailto:techscope60@gmail.com">techscope60@gmail.com</a></p>

    <form action="https://formspree.io/f/your-form-id" method="POST" class="contact-form" aria-label="Contact form">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" required />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required />

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <!-- Honeypot to reduce spam -->
      <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off" />

      <button type="submit" class="btn">Send</button>
    </form>

    <p class="muted">Note: replace the Formspree endpoint with your form provider or handle submissions on your server.</p>
  </main>
</body>
</html>
